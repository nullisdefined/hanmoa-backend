name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package*.json deploy/
          cp swagger.yml deploy/
          cp swagger-worker.yml deploy/
          cd deploy
          npm ci --only=production
          tar -czf ../deploy.tar.gz .

      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'deploy.tar.gz'
          target: '/home/ubuntu/apps'

      - name: Run deployment script
        uses: appleboy/ssh-action@master
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_CALLBACK_URL: ${{ secrets.GH_CALLBACK_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DEVTOOLS_PORT: ${{ secrets.DEVTOOLS_PORT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NODE_ENV,PORT,DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD,DB_DATABASE,JWT_SECRET,JWT_EXPIRES_IN,GH_CLIENT_ID,GH_CLIENT_SECRET,GH_CALLBACK_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,FRONTEND_URL,DEVTOOLS_PORT,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,AWS_S3_BUCKET,AWS_CLOUDFRONT_DOMAIN
          script: |
            cd /home/ubuntu/apps/hanmoa-backend

            # Backup current version
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            echo "Creating backup: backup_$TIMESTAMP"
            mkdir -p ../backups
            tar -czf ../backups/hanmoa-backend_$TIMESTAMP.tar.gz dist .env 2>/dev/null || echo "No previous version to backup"

            # Extract new version
            cd /home/ubuntu/apps
            tar -xzf deploy.tar.gz -C hanmoa-backend
            rm deploy.tar.gz

            cd hanmoa-backend

            # Create .env file
            cat > .env << EOF
            NODE_ENV=$NODE_ENV
            PORT=$PORT
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            DB_DATABASE=$DB_DATABASE
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=$JWT_EXPIRES_IN
            GITHUB_CLIENT_ID=$GH_CLIENT_ID
            GITHUB_CLIENT_SECRET=$GH_CLIENT_SECRET
            GITHUB_CALLBACK_URL=$GH_CALLBACK_URL
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            GOOGLE_CALLBACK_URL=$GOOGLE_CALLBACK_URL
            FRONTEND_URL=$FRONTEND_URL
            DEVTOOLS_PORT=$DEVTOOLS_PORT
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            AWS_REGION=$AWS_REGION
            AWS_S3_BUCKET=$AWS_S3_BUCKET
            AWS_CLOUDFRONT_DOMAIN=$AWS_CLOUDFRONT_DOMAIN
            EOF

            # Restart application
            pm2 restart hanmoa-backend || pm2 start dist/main.js --name hanmoa-backend

            # Wait for application to start
            echo "Waiting for application to start..."
            sleep 10

            # Health check
            if curl -f http://localhost:$PORT/health; then
              echo "✓ Health check passed - Deployment successful"
              # Keep only last 1 backup
              cd ../backups
              ls -t hanmoa-backend_*.tar.gz 2>/dev/null | tail -n +2 | xargs rm -f 2>/dev/null || true
              exit 0
            else
              echo "✗ Health check failed - Rolling back to previous version"
              pm2 logs hanmoa-backend --lines 50

              # Rollback
              cd /home/ubuntu/apps/hanmoa-backend
              LATEST_BACKUP=$(ls -t ../backups/hanmoa-backend_*.tar.gz 2>/dev/null | head -n 1)

              if [ -n "$LATEST_BACKUP" ]; then
                echo "Restoring from backup: $LATEST_BACKUP"
                tar -xzf "$LATEST_BACKUP" -C .
                pm2 restart hanmoa-backend
                sleep 5

                if curl -f http://localhost:$PORT/health; then
                  echo "✓ Rollback successful - Previous version restored"
                else
                  echo "✗ Rollback failed - Manual intervention required"
                fi
              else
                echo "✗ No backup found - Manual intervention required"
              fi

              exit 1
            fi
