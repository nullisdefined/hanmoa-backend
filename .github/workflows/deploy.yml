name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ec2-user
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          for i in {1..5}; do
            if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} "echo 'SSH Ready'"; then
              echo "SSH connection successful"
              break
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} '
            if ! command -v node &> /dev/null; then
              curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash -
              sudo yum install -y nodejs
            fi

            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            mkdir -p ~/hanmoa-backend
            cd ~/hanmoa-backend
            rm -rf *
          '

          scp -o StrictHostKeyChecking=no -i private_key.pem -r * ${USER}@${HOST}:~/hanmoa-backend/

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} "
            cd ~/hanmoa-backend

            cat > .env << 'ENVEOF'
          NODE_ENV=production
          PORT=3000
          DB_HOST=${DB_HOST}
          DB_PORT=5432
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          DB_DATABASE=${DB_DATABASE}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=7d
          ENVEOF

            npm install
            npm run build

            pm2 delete hanmoa-backend || true
            pm2 start dist/main.js --name hanmoa-backend
            pm2 save
          "

          rm -f private_key.pem
