name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package*.json deploy/
          cd deploy
          npm ci --only=production
          tar -czf ../deploy.tar.gz .

      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'deploy.tar.gz'
          target: '/home/ubuntu/apps'

      - name: Run deployment script
        uses: appleboy/ssh-action@master
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NODE_ENV,PORT,DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD,DB_DATABASE,JWT_SECRET,JWT_EXPIRES_IN
          script: |
            cd /home/ubuntu/apps/hanmoa-backend

            # Backup current version
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            echo "Creating backup: backup_$TIMESTAMP"
            mkdir -p ../backups
            tar -czf ../backups/hanmoa-backend_$TIMESTAMP.tar.gz dist .env 2>/dev/null || echo "No previous version to backup"

            # Extract new version
            cd /home/ubuntu/apps
            tar -xzf deploy.tar.gz -C hanmoa-backend
            rm deploy.tar.gz

            cd hanmoa-backend

            # Create .env file
            cat > .env << EOF
            NODE_ENV=$NODE_ENV
            PORT=$PORT
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            DB_DATABASE=$DB_DATABASE
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=$JWT_EXPIRES_IN
            EOF

            # Restart application
            pm2 restart hanmoa-backend || pm2 start dist/main.js --name hanmoa-backend

            # Wait for application to start
            echo "Waiting for application to start..."
            sleep 10

            # Health check
            if curl -f http://localhost:$PORT/health; then
              echo "✓ Health check passed - Deployment successful"
              # Keep only last 1 backup
              cd ../backups
              ls -t hanmoa-backend_*.tar.gz 2>/dev/null | tail -n +2 | xargs rm -f 2>/dev/null || true
              exit 0
            else
              echo "✗ Health check failed - Rolling back to previous version"
              pm2 logs hanmoa-backend --lines 50

              # Rollback
              cd /home/ubuntu/apps/hanmoa-backend
              LATEST_BACKUP=$(ls -t ../backups/hanmoa-backend_*.tar.gz 2>/dev/null | head -n 1)

              if [ -n "$LATEST_BACKUP" ]; then
                echo "Restoring from backup: $LATEST_BACKUP"
                tar -xzf "$LATEST_BACKUP" -C .
                pm2 restart hanmoa-backend
                sleep 5

                if curl -f http://localhost:$PORT/health; then
                  echo "✓ Rollback successful - Previous version restored"
                else
                  echo "✗ Rollback failed - Manual intervention required"
                fi
              else
                echo "✗ No backup found - Manual intervention required"
              fi

              exit 1
            fi
