openapi: 3.0.3
info:
  title: Hanmoa API Spec Draft
  description: Hanmoa Backend API Documentation
  version: 0.1.0

tags:
  - name: auth
    description: 인증 및 사용자 관리
  - name: projects
    description: 프로젝트 관리
  - name: videos
    description: 영상 업로드 및 관리
  - name: dub-jobs
    description: 더빙 작업 생성 및 관리
  - name: speakers
    description: 화자 관리
  - name: segments
    description: 세그먼트 조회 및 편집
  - name: subtitles
    description: 자막 관리
  - name: voices
    description: 음성 프로필 조회

paths:
  # ===== Auth =====
  /auth/login/google:
    post:
      tags: [auth]
      summary: Google 소셜 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google ID token
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          user:
                            $ref: '#/components/schemas/User'

  /auth/login/github:
    post:
      tags: [auth]
      summary: GitHub 소셜 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: GitHub OAuth code
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          user:
                            $ref: '#/components/schemas/User'

  /auth/me:
    get:
      tags: [auth]
      summary: 현재 사용자 정보 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /auth/profile:
    patch:
      tags: [auth]
      summary: 프로필 수정
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                avatarUrl:
                  type: string
      responses:
        '200':
          description: 프로필 업데이트 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  # ===== Projects =====
  /projects:
    get:
      tags: [projects]
      summary: 프로젝트 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

    post:
      tags: [projects]
      summary: 새 프로젝트 생성
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: 프로젝트 생성 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

  /projects/{projectId}:
    get:
      tags: [projects]
      summary: 프로젝트 상세 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: 프로젝트 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

    patch:
      tags: [projects]
      summary: 프로젝트 수정
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

    delete:
      tags: [projects]
      summary: 프로젝트 삭제
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Project deleted successfully

  # ===== Videos =====
  /projects/{projectId}/videos:
    get:
      tags: [videos]
      summary: 프로젝트의 비디오 목록
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: 비디오 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VideoAsset'

  /projects/{projectId}/videos/upload-url:
    post:
      tags: [videos]
      summary: S3 Presigned URL 발급 (업로드용)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType]
              properties:
                fileName:
                  type: string
                contentType:
                  type: string
                  example: video/mp4
      responses:
        '200':
          description: Presigned URL 발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          uploadUrl:
                            type: string
                          s3Key:
                            type: string
                          videoAssetId:
                            type: string
                            format: uuid

  /projects/{projectId}/videos/{videoId}/complete:
    post:
      tags: [videos]
      summary: 업로드 완료 알림
      description: 클라이언트가 S3 업로드 완료 후 호출하여 비디오 처리 시작
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/videoId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                srcLang:
                  type: string
                  example: ko
      responses:
        '200':
          description: 비디오 처리 시작
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VideoAsset'

  /projects/{projectId}/videos/{videoId}:
    get:
      tags: [videos]
      summary: 비디오 상세 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/videoId'
      responses:
        '200':
          description: 비디오 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VideoAsset'

    delete:
      tags: [videos]
      summary: 비디오 삭제
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/videoId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Video deleted successfully

  # ===== Dub Jobs =====
  /projects/{projectId}/dub-jobs:
    get:
      tags: [dub-jobs]
      summary: 더빙 작업 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processing, completed, failed]
      responses:
        '200':
          description: 더빙 작업 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DubJob'

    post:
      tags: [dub-jobs]
      summary: 새 더빙 작업 생성
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoAssetId, dubbingConfig]
              properties:
                videoAssetId:
                  type: string
                  format: uuid
                dubbingConfig:
                  $ref: '#/components/schemas/DubbingConfigInput'
      responses:
        '201':
          description: 더빙 작업 생성 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DubJob'

  /projects/{projectId}/dub-jobs/{jobId}:
    get:
      tags: [dub-jobs]
      summary: 더빙 작업 상세 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: 더빙 작업 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DubJobDetail'

    delete:
      tags: [dub-jobs]
      summary: 더빙 작업 취소/삭제
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: 작업 취소 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string

  /projects/{projectId}/dub-jobs/{jobId}/retry:
    post:
      tags: [dub-jobs]
      summary: 실패한 작업 재시도
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: 재시도 시작
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DubJob'

  # ===== Speakers =====
  /projects/{projectId}/speakers:
    get:
      tags: [speakers]
      summary: 프로젝트의 화자 목록
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: 화자 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Speaker'

    post:
      tags: [speakers]
      summary: 화자 추가
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          description: 화자 생성 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Speaker'

  /projects/{projectId}/speakers/{speakerId}:
    patch:
      tags: [speakers]
      summary: 화자 정보 수정
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/speakerId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                displayName:
                  type: string
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Speaker'

    delete:
      tags: [speakers]
      summary: 화자 삭제
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/speakerId'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Speaker deleted successfully

  # ===== Segments =====
  /projects/{projectId}/dub-jobs/{jobId}/segments:
    get:
      tags: [segments]
      summary: 더빙 작업의 세그먼트 목록
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: 세그먼트 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Segment'

  /projects/{projectId}/dub-jobs/{jobId}/segments/{segmentId}/regenerate:
    post:
      tags: [segments]
      summary: 특정 세그먼트 재생성
      description: 어색한 세그먼트를 다시 재생성 요청
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/jobId'
        - $ref: '#/components/parameters/segmentId'
      responses:
        '200':
          description: 세그먼트 재생성 시작
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Segment'
                      message:
                        type: string
                        example: Segment regeneration started

  # ===== Subtitles =====
  /projects/{projectId}/dub-jobs/{jobId}/subtitles:
    get:
      tags: [subtitles]
      summary: 자막 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/jobId'
        - in: query
          name: lang
          schema:
            type: string
          description: 언어 필터 (ko, en 등)
      responses:
        '200':
          description: 자막 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Subtitle'

  /projects/{projectId}/dub-jobs/{jobId}/subtitles/export:
    get:
      tags: [subtitles]
      summary: 자막 내보내기 (SRT)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/jobId'
        - in: query
          name: lang
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SRT 파일
          content:
            text/plain:
              schema:
                type: string

  # ===== Voice Profiles =====
  /voices:
    get:
      tags: [voices]
      summary: 사용 가능한 음성 프로필 목록
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: provider
          schema:
            type: string
          description: TTS 제공자 필터 (openai, elevenlabs 등)
        - in: query
          name: locale
          schema:
            type: string
          description: 로케일 필터 (ko-KR, en-US 등)
        - in: query
          name: gender
          schema:
            type: string
            enum: [male, female, neutral]
      responses:
        '200':
          description: 음성 프로필 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VoiceProfile'

# ===== Components =====
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    projectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid

    videoId:
      in: path
      name: videoId
      required: true
      schema:
        type: string
        format: uuid

    jobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
        format: uuid

    segmentId:
      in: path
      name: segmentId
      required: true
      schema:
        type: string
        format: uuid

    speakerId:
      in: path
      name: speakerId
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # 공통 응답 포맷
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string

    ApiError:
      type: object
      properties:
        code:
          type: string
          example: ERROR_CODE
        message:
          type: string
          example: Error message

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ApiError'

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # 엔티티 스키마
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        avatarUrl:
          type: string
        authProvider:
          type: string
          enum: [google, github]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VideoAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        s3KeyOriginal:
          type: string
        durationSec:
          type: integer
        srcLang:
          type: string
        status:
          type: string
          enum: [uploading, processing, ready, error]
        mediaMeta:
          type: object
          description: 해상도, 코덱, 비트레이트 등
        createdAt:
          type: string
          format: date-time

    DubJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        videoAssetId:
          type: string
          format: uuid
        dubbingConfigId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 100
        errorCode:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    DubJobDetail:
      allOf:
        - $ref: '#/components/schemas/DubJob'
        - type: object
          properties:
            dubbingConfig:
              $ref: '#/components/schemas/DubbingConfig'
            steps:
              type: array
              items:
                $ref: '#/components/schemas/JobStep'
            outputAsset:
              $ref: '#/components/schemas/OutputAsset'

    DubbingConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        targetLang:
          type: string
          enum: [ko]

    DubbingConfigInput:
      type: object
      required: [targetLang]
      properties:
        targetLang:
          type: string
          enum: [ko]
          example: ko
          description: 목표 언어

    JobStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            [source_separation, speech_recognition, translation, tts, mixing]
        status:
          type: string
          enum: [pending, running, completed, failed]
        progress:
          type: number
          format: float
        log:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    Speaker:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        label:
          type: string
        displayName:
          type: string

    Segment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        speakerId:
          type: string
          format: uuid
        startMs:
          type: integer
        endMs:
          type: integer
        srcText:
          type: string
        mtText:
          type: string
        ttsAssetId:
          type: string
          format: uuid

    Subtitle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        startMs:
          type: integer
        endMs:
          type: integer
        text:
          type: string
        lang:
          type: string

    OutputAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        s3KeyVideo:
          type: string
        s3KeyAudio:
          type: string
        s3KeySrt:
          type: string
        playbackUrl:
          type: string

    VoiceProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          example: openai
        code:
          type: string
          example: alloy
        name:
          type: string
        gender:
          type: string
          enum: [male, female, neutral]
        locale:
          type: string
        caps:
          type: object
          description: 지원 기능 (속도 조절, 감정 등)
